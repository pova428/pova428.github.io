<!DOCTYPE html>
<html lang="ca">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        padding: 40px 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #f5f5ff;
        text-align: center;
        background:
            radial-gradient(circle at 50% 20%, #283b68 0%, transparent 45%),
            linear-gradient(135deg, #080c18, #151b2e 60%, #090e1b);
    }

    h1 {
        font-size: clamp(32px, 5vw, 52px);
        font-weight: 800;
        letter-spacing: -1.5px;
        margin: 0;
        background: linear-gradient(90deg, #ffffff, #8cbaff, #bd9bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    p {
        max-width: 650px;
        color: #aebbd3;
        font-size: 17px;
        line-height: 1.8;
        margin: 0;
    }

    .g_id_signin {
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    #missatge-benvinguda {
        padding: 25px 35px;
        border-radius: 18px;
        background: rgba(76, 126, 220, 0.16);
        border: 1px solid rgba(120, 165, 255, 0.4);
        box-shadow: 0 10px 35px rgba(50, 100, 220, 0.15);
        font-size: 25px;
        color: #a9caff;
    }

    #boto-sortir {
        padding: 13px 30px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #527cf5, #8958e8);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #boto-sortir:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(100, 120, 255, 0.4);
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 32px;
        }

        p {
            font-size: 15px;
        }
    }
</style>
    
<head>
    <meta charset="UTF-8">
    <title>PT 2.5 - GOOGLE SIGN IN</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="google-signin-client_id" content="916042126498-4h8m7rlhn645mkkbaus2tdapa07v56uu.apps.googleusercontent.com">
</head>

<body>

    <div
        id="g_id_onload"
        data-client_id="916042126498-4h8m7rlhn645mkkbaus2tdapa07v56uu.apps.googleusercontent.com"
        data-callback="onSignIn">
    </div>

    <div
        class="g_id_signin"
        data-type="standard">
    </div>

    <h1>PT 2.5 - GOOGLE SIGN IN</h1>
    <p>Pàgina preparada per afegir el OAuth 2.</p>

    <h2 id="missatge-benvinguda" style="display:none;">
    Missatge de benvinguda
    </h2>

    <button
    id="boto-sortir"
    style="display:none;"
    onclick="signOut()">
    Desconnectar
    </button>
    
    <script>
    function onSignIn(response) {
    var id_token = response.credential;

    console.log("ID Token: " + id_token);

    const dades = JSON.parse(decodeURIComponent(escape(atob(
        id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')
    ))));

    document.getElementById('boto-sortir').style.display = 'block';
    document.querySelector('.g_id_signin').style.display = 'none';

    const missatge = document.getElementById('missatge-benvinguda');
    missatge.textContent = 'Benvingut/da, ' + dades.name;
    missatge.style.display = 'block';
    }

    function signOut() {
        document.getElementById('boto-sortir').style.display = 'none';
        document.querySelector('.g_id_signin').style.display = 'block';
        document.getElementById('missatge-benvinguda').style.display = 'none';
    }
</script>
</body>

</html>
